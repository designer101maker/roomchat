<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <!-- Favicon placeholder with standard chat bubble emoji -->
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  <!-- Tailwind CSS CDN -->
  <script src="https://jsdelivr.net"></script>
  <!-- Custom Base Font Style matching iOS Ecosystem -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Hide scrollbar tracks for modern, cleaner look while maintaining functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-zinc-900 dark:text-zinc-100 h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- Header Section -->
  <header class="bg-white/80 dark:bg-zinc-800/80 backdrop-blur-md border-b border-gray-200 dark:border-zinc-700/50 sticky top-0 z-10 px-4 py-3 flex items-center justify-between shadow-xs">
    <div class="flex flex-col">
      <h1 class="text-xs font-semibold text-gray-500 dark:text-zinc-400 uppercase tracking-wider">Active Chat Room</h1>
      <span id="room-display" class="text-base font-bold text-gray-800 dark:text-zinc-100 tracking-tight">Loading Room...</span>
    </div>
    <button id="copy-btn" class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-full transition-all active:scale-95 shadow-sm cursor-pointer">
      <span>Copy Invite Link</span>
    </button>
  </header>

  <!-- Chat Messages Container -->
  <main id="chat-container" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 no-scrollbar max-w-3xl mx-auto w-full">
    <!-- Messages are injected programmatically -->
  </main>

  <!-- Input Footer Dock -->
  <footer class="bg-white/80 dark:bg-zinc-800/80 backdrop-blur-md border-t border-gray-200 dark:border-zinc-700/50 p-3 sticky bottom-0 z-10 max-w-3xl mx-auto w-full rounded-t-2xl sm:mb-2 sm:shadow-lg">
    <form id="message-form" class="flex items-center gap-2">
      <input 
        id="message-input" 
        type="text" 
        placeholder="iMessage" 
        autocomplete="off"
        class="flex-1 px-4 py-2 bg-gray-100 dark:bg-zinc-700/50 border border-transparent focus:border-blue-500/30 rounded-full text-sm outline-none transition-all placeholder-gray-400 dark:placeholder-zinc-500 text-gray-900 dark:text-zinc-100"
      />
      <button 
        id="send-btn" 
        type="submit" 
        class="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-full transition-all active:scale-90 flex items-center justify-center cursor-pointer shadow-xs disabled:opacity-50"
      >
        <!-- Arrow Up SVG Icon -->
        <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
        </svg>
      </button>
    </form>
  </footer>

  <!-- Firebase Script Integration Boilerplate -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      where, 
      orderBy, 
      onSnapshot, 
      serverTimestamp 
    } from "https://gstatic.com";

    // 1. REPLACE WITH YOUR FIREBASE CONFIGURATION DATA
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialise Firebase Apps
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. Local State Management & Anonymous Setup
    let currentUsername = localStorage.getItem('chat_username');
    if (!currentUsername) {
      currentUsername = `User_${Math.floor(1000 + Math.random() * 9000)}`;
      localStorage.setItem('chat_username', currentUsername);
    }

    // 3. Routing Engine (Query Param Check/Gen)
    function getRoomId() {
      const urlParams = new URLSearchParams(window.location.search);
      let room = urlParams.get('room');
      
      if (!room) {
        // Generate random 6 character AlphaNumeric string room ID
        room = Math.random().toString(36).substring(2, 8).toUpperCase();
        urlParams.set('room', room);
        const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
        window.history.pushState({ path: newUrl }, '', newUrl);
      }
      return room.toUpperCase();
    }

    const currentRoomId = getRoomId();
    document.getElementById('room-display').textContent = `#${currentRoomId}`;
    const defaultTitle = `Chat Room: ${currentRoomId}`;
    document.title = defaultTitle;

    const defaultFavicon = "data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>";
    const alertFavicon = "data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😊</text></svg>";

    // 4. Dom Selectors
    const chatContainer = document.getElementById('chat-container');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const copyBtn = document.getElementById('copy-btn');
    const faviconEl = document.getElementById('favicon');

    // 5. Sharing System
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = "<span>Copied! ✓</span>";
        copyBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
        }, 2000);
      } catch (err) {
        console.error('Failed to copy room link: ', err);
      }
    });

    // 6. Database Operations & Listener Pipeline
    const messagesRef = collection(db, "messages");
    const roomQuery = query(
      messagesRef, 
      where("roomId", "==", currentRoomId), 
      orderBy("timestamp", "asc")
    );

    let isInitialLoad = true;

    onSnapshot(roomQuery, (snapshot) => {
      // Keep track of whether we received a live message addition
      let hasNewMessage = false;

      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          const msgData = change.doc.data();
          renderMessage(msgData);
          if (!isInitialLoad) {
            hasNewMessage = true;
          }
        }
      });

      // After rendering elements, slide smoothly down into alignment
      scrollToBottom();
      isInitialLoad = false;

      // Handle unread updates across the visibility boundary
      if (hasNewMessage && document.hidden) {
        document.title = "😊 New Message!";
        faviconEl.setAttribute('href', alertFavicon);
      }
    });

    // 7. Message Element Generation Strategy
    function renderMessage(data) {
      const isMe = data.sender === currentUsername;
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col w-full ${isMe ? 'items-end' : 'items-start'}`;

      // System fallback check for pending server timestamps
      const formattedTime = data.timestamp 
        ? new Date(data.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
        : 'Just now';

      wrapper.innerHTML = `
        <span class="text-[10px] text-gray-400 dark:text-zinc-500 mb-0.5 px-2 tracking-wide font-medium">
          ${isMe ? 'You' : data.sender} • ${formattedTime}
        </span>
        <div class="max-w-[75%] px-3.5 py-2 rounded-2xl text-sm font-normal break-words leading-relaxed tracking-wide shadow-xs
          ${isMe 
            ? 'bg-blue-600 text-white rounded-br-none' 
            : 'bg-gray-200 dark:bg-zinc-800 text-gray-900 dark:text-zinc-100 rounded-bl-none'
          }">
          ${escapeHTML(data.text)}
        </div>
      `;
      chatContainer.appendChild(wrapper);
    }

    // Form Event Handler
    messageForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      messageInput.value = '';

      try {
        await addDoc(messagesRef, {
          roomId: currentRoomId,
          sender: currentUsername,
          text: text,
          timestamp: serverTimestamp()
        });
      } catch (error) {
        console.error("Error broadcast failing: ", error);
      }
    });

    // 8. Tab Visibility Interface Realignment
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        document.title = defaultTitle;
        faviconEl.setAttribute('href', defaultFavicon);
      }
    });

    // Helper Utility Methods
    function scrollToBottom() {
      chatContainer.scrollTo({
        top: chatContainer.scrollHeight,
        behavior: 'smooth'
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
